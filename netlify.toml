# HidroSopó · Netlify (app del productor, laboratorio y «Sopó Cuida el Agua»)
# Sitio estático: no hay paso de construcción.
[build]
  publish = "04_dashboard"
  command = "echo 'sitio estático, sin build'"

# La app llama a /api/... en su mismo dominio y Netlify lo reenvía a Render.
# Si la URL de Render cambia, se cambia SOLO aquí.
[[redirects]]
  from = "/api/*"
  to = "https://hidrosopo.onrender.com/api/:splat"
  status = 200
  force = true

# Direcciones cortas para el póster, el plegable y las presentaciones
[[redirects]]
  from = "/laboratorio"
  to = "/gemelo.html"
  status = 301
[[redirects]]
  from = "/agua"
  to = "/comunidad.html"
  status = 301
[[redirects]]
  from = "/resultados"
  to = "/resultados.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# El service worker y las páginas siempre se revalidan: cada despliegue llega de una
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/iconos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
